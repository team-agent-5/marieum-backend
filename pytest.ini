[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
pythonpath = src
testpaths = tests
addopts = -ra --tb=short -m "not slow"
markers =
    slow: marks tests as slow (model download, full app boot) -- deselected by default
    integration: marks tests as integration tests requiring live Postgres + seed data
